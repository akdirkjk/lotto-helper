name: 데이터 갱신

on:
  schedule:
    - cron: '30 12 * * 6'   # 토 21:30 KST  (로또 추첨 직후)
    - cron: '30 21 * * 6'   # 일 06:30 KST  (재확인)
    - cron: '30 11 * * 4'   # 목 20:30 KST  (연금복권 추첨 직후)
    - cron: '0 22 * * *'    # 매일 07:00 KST (스피또 잔여수량)
  workflow_dispatch:         # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 데이터 받아오기
        run: node scripts/update.mjs

      - name: 변경이 있으면 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lottery.json
          if git diff --cached --quiet; then
            echo "저장할 변경 없음"
          else
            git commit -m "data: 당첨번호 갱신"
            git push
          fi

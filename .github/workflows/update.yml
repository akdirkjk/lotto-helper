name: Update data

on:
  schedule:
    - cron: '30 12 * * 6'   # Sat 21:30 KST (after Lotto draw)
    - cron: '30 21 * * 6'   # Sun 06:30 KST (recheck)
    - cron: '30 11 * * 4'   # Thu 20:30 KST (after Pension draw)
    - cron: '0 22 * * *'    # Daily 07:00 KST (Speetto)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch data
        run: node scripts/update.mjs

      - name: Save changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lottery.json
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "data: update results"
            git push
          fi

name: 주소 탐색 (한 번만 실행)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 연금복권·스피또 데이터 주소 찾기
        run: node scripts/discover.mjs
